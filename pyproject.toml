[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfarm"
dynamic = ["version"]
description = "Agent Farm Simulation Framework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependencies. requirements.txt installs this package with the
# `dev` extra, so this list is the single source of truth.
dependencies = [
    # Core
    "numpy>=1.24.0,<2.3.0",  # NumPy 2.3+ incompatible with Numba (Tianshou dependency)
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.9.0",  # Axes.boxplot(tick_labels=...)
    "pyyaml>=6.0",
    "sqlalchemy>=1.4.0",
    "pydantic>=2.0.0",
    "deepdiff>=5.8.0",
    "pettingzoo>=1.24.0",
    # Database / memory
    "redis>=4.0.0",
    # GUI. Pillow 13 fixes CVEs that 12.x does not but requires Python 3.11+,
    # so the lock forks: 12.x on 3.10, 13+ elsewhere.
    "pillow>=12.3.0; python_version < '3.11'",
    "pillow>=13.0.0; python_version >= '3.11'",
    "pywin32>=228; sys_platform == 'win32'",
    # Visualization
    "snakeviz>=2.1.0",
    "seaborn>=0.11.0",
    # Utilities
    "tqdm>=4.62.0",
    "colorama>=0.4.4",
    "python-dotenv>=0.19.0",
    "psutil>=5.8.0",
    # Logging
    "structlog>=24.1.0",
    "python-json-logger>=2.0.0",
    # Machine learning
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.2.0",
    "xgboost>=1.7.0",
    "lightgbm>=3.3.0",
    # Data analysis
    "networkx>=2.6.0",
    "plotly>=5.3.0",
    "dash>=2.0.0",
    "statsmodels>=0.14.0",
    "pyarrow>=10.0.0",
    # Reinforcement learning
    "tianshou>=0.4.11,<0.6.0",  # pinned due to NumPy compatibility
    "gymnasium>=0.28.0",
    "shimmy>=1.0.0",
    "stable-baselines3>=2.0.0",
    # Web API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "httpx>=0.24.0",
    # LLM integration
    "openai>=1.0.0",
    "pyscn>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Dooders/AgentFarm"
Documentation = "https://dooders.github.io/AgentFarm/"
Changelog = "https://github.com/Dooders/AgentFarm/blob/main/CHANGELOG.md"
Issues = "https://github.com/Dooders/AgentFarm/issues"

[project.optional-dependencies]
dev = [
    "pytest>=6.2.5",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "fakeredis>=2.0.0",
    "hypothesis>=6.100.0",
]
notary = [
    "farm-notary @ git+https://github.com/Dooders/FarmNotary.git@v0.1.0",
]
# Video export (scripts/animate_simulation.py). Kept optional because moviepy
# 2.x caps Pillow below 12, which would hold the core install on a Pillow
# line with known CVEs.
media = [
    "moviepy>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["farm*"]

[tool.setuptools.package-data]
"farm.config" = ["*.yaml", "*.json", "environments/*.yaml", "profiles/*.yaml", "templates/*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "farm._version.__version__"}

[tool.pylint.messages_control]
disable = [
    "logging-fstring-interpolation",  # Allow f-strings in logging
    "logging-format-interpolation",   # Allow % formatting in logging
    "attribute-defined-outside-init", # Allow attributes defined outside __init__
    "protected-access",               # Allow access to protected members
    "too-many-arguments",             # Allow many function arguments
    "too-many-instance-attributes",   # Allow many instance attributes
    "too-few-public-methods",         # Allow classes with few public methods
    "invalid-name",                   # Allow various naming conventions
    "missing-docstring",              # Don't require docstrings
    "line-too-long",                  # Allow long lines
    "too-many-lines",                 # Allow long files
    "too-many-branches",              # Allow many branches
    "too-many-statements",            # Allow many statements
    "too-many-locals",                # Allow many local variables
    "unused-argument",                # Allow unused arguments
    "redefined-builtin",              # Allow redefining built-ins
    "redefined-outer-name",           # Allow redefining outer names
    "reimported",                     # Allow reimporting modules
    "unused-import",                  # Allow unused imports (for now)
    "import-outside-toplevel",        # Allow imports outside toplevel
    "broad-except",                   # Allow broad exception handling
    "fixme",                          # Allow TODO/FIXME comments
    "no-member",                      # Reduce false positives for dynamic attributes
    "dangerous-default-value",        # Allow mutable objects as default arguments
    "raise-missing-from",             # Allow raising exceptions without 'from' clause
    "not-callable",                   # Allow SQLAlchemy func.* calls (E1102)
    "unsubscriptable-object",         # Allow SQLAlchemy query results
    "unsupported-assignment-operation", # Allow SQLAlchemy operations
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 10
max-locals = 25
max-returns = 10
max-branches = 20
max-statements = 60
max-parents = 10

[tool.pylint.similarities]
min-similarity-lines = 6

[tool.mypy]
# Informational in CI (tests.yml `typecheck` job). Scope and strictness are
# intentionally modest; tighten as the baseline shrinks.
python_version = "3.10"
files = ["farm/core", "farm/api", "farm/config"]
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true

[tool.ruff]
# Alternative to pylint - more modern and faster
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Disable overly aggressive rules
ignore = [
    "E501",  # Line too long
    "F401",  # Unused imports
    "F841",  # Unused variables
    "C901",  # Too complex
    "PLR0913",  # Too many arguments
    "PLR0912",  # Too many branches
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic value comparison
    "PLR0911",  # Too many return statements
    "S101",   # Assert used
    "T10",    # Debugger statements
    "ERA001", # Commented out code
    "PD",     # Pandas best practices
    "N",      # Naming conventions
    "D",      # Docstring requirements
    "ANN",    # Type annotations
    "BLE001", # Blind except
    "FBT",    # Boolean in function arguments
    "A",      # Shadowing built-ins
    "COM812", # Trailing comma missing
    "ISC001", # Implicitly concatenated string literals
    "ICN001", # Import conventions
    "G004",   # Logging statement uses f-string
    "S603",   # Untrusted input for subprocess
    "EM101",  # Exception must not use f-string
    "TRY003", # Avoid specifying long messages outside exception class
    "RUF012", # Mutable class attributes
]

[tool.ruff.lint.per-file-ignores]
# Allow more leniency in test files
"tests/**/*" = ["S101", "PLR2004"]
"**/__init__.py" = ["F401"]  # Allow unused imports in __init__.py
# Exploratory notebooks are not held to production import/style rules
"notebooks/**/*.ipynb" = ["E402", "E401", "F541", "F811", "F821"]