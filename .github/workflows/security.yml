name: security

# Dependency vulnerability scanning. Runs when the dependency set changes and
# on a weekly schedule so newly published advisories are caught between
# dependency changes.
#
# pip-audit is blocking. Advisories that cannot be fixed within the current
# dependency constraints are listed explicitly in the --ignore-vuln flags
# with the reason; remove an entry as soon as the constraint is lifted.
#
# npm audit is informational: the Jest toolchain under farm/editor carries
# known advisories whose fixes require major upgrades, which Dependabot
# proposes separately.

on:
  push:
    branches: [main, dev]
    paths:
      - pyproject.toml
      - requirements-lock.txt
      - farm/editor/package.json
      - farm/editor/package-lock.json
      - .github/workflows/security.yml
  pull_request:
    branches: [main, dev]
    paths:
      - pyproject.toml
      - requirements-lock.txt
      - farm/editor/package.json
      - farm/editor/package-lock.json
      - .github/workflows/security.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit the locked dependency set
        # protobuf 3.19.x: pinned by tianshou 0.4.11 (protobuf~=3.19.0); fix
        #   needs tianshou>=0.5, which is held back for NumPy compatibility.
        # Python 3.10-only exceptions: filelock 4.1.x, Pillow 12.x, and
        #   tornado 6.5.x are the latest releases compatible with Python 3.10;
        #   their audited fixes require Python 3.11+. Remove these exceptions
        #   when Python 3.10 support is dropped. Python 3.12 uses fixed releases.
        run: |
          ignores=(
            --ignore-vuln PYSEC-2026-1805
            --ignore-vuln PYSEC-2026-1806
            --ignore-vuln CVE-2026-96640
            --ignore-vuln CVE-2026-96778
            --ignore-vuln GHSA-78g4-xqwv-q3g8
          )
          if [[ "${{ matrix.python }}" == "3.10" ]]; then
            ignores+=(
              --ignore-vuln CVE-2026-112906
              --ignore-vuln CVE-2026-112940
              --ignore-vuln CVE-2026-112914
              --ignore-vuln CVE-2026-112913
              --ignore-vuln CVE-2026-112937
              --ignore-vuln CVE-2026-112907
              --ignore-vuln CVE-2026-112938
              --ignore-vuln CVE-2026-112910
              --ignore-vuln CVE-2026-112934
              --ignore-vuln CVE-2026-112909
              --ignore-vuln CVE-2026-112911
              --ignore-vuln CVE-2026-112939
              --ignore-vuln CVE-2026-112915
              --ignore-vuln CVE-2026-112935
              --ignore-vuln CVE-2026-112912
              --ignore-vuln CVE-2026-112908
              --ignore-vuln CVE-2026-112941
              --ignore-vuln PYSEC-2026-4327
              --ignore-vuln PYSEC-2026-4328
              --ignore-vuln PYSEC-2026-4326
              --ignore-vuln PYSEC-2026-4339
              --ignore-vuln PYSEC-2026-4340
              --ignore-vuln PYSEC-2026-4343
              --ignore-vuln PYSEC-2026-4334
              --ignore-vuln PYSEC-2026-4337
              --ignore-vuln PYSEC-2026-4341
              --ignore-vuln PYSEC-2026-4330
              --ignore-vuln PYSEC-2026-4338
              --ignore-vuln PYSEC-2026-4335
              --ignore-vuln PYSEC-2026-4336
              --ignore-vuln PYSEC-2026-4331
              --ignore-vuln PYSEC-2026-4332
              --ignore-vuln PYSEC-2026-4329
              --ignore-vuln PYSEC-2026-4333
              --ignore-vuln PYSEC-2026-4342
              --ignore-vuln CVE-2026-112895
              --ignore-vuln CVE-2026-112400
              --ignore-vuln CVE-2026-112897
              --ignore-vuln CVE-2026-112395
              --ignore-vuln CVE-2026-112404
              --ignore-vuln CVE-2026-112899
              --ignore-vuln CVE-2026-112900
              --ignore-vuln CVE-2026-112893
              --ignore-vuln CVE-2026-112891
              --ignore-vuln CVE-2026-112390
              --ignore-vuln CVE-2026-112401
              --ignore-vuln CVE-2026-112391
              --ignore-vuln CVE-2026-112894
              --ignore-vuln CVE-2026-112406
              --ignore-vuln CVE-2026-112399
              --ignore-vuln CVE-2026-112892
              --ignore-vuln CVE-2026-112393
              --ignore-vuln CVE-2026-96638
              --ignore-vuln CVE-2026-116577
              --ignore-vuln CVE-2026-115927
              --ignore-vuln CVE-2026-116578
            )
          fi
          pip-audit -r requirements-lock.txt --no-deps --progress-spinner off --strict "${ignores[@]}"

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: farm/editor
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Audit editor dev dependencies (informational)
        continue-on-error: true
        run: npm audit --audit-level=high
