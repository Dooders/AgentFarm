name: nightly-heavy-tests

# Full suite including the `slow` and `integration` markers. `-m ""` already
# selects tests/test_deterministic_pytest.py, so it is not run a second time.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps
      - name: Run full heavy pytest suite
        run: |
          pytest -q -vv --durations=50 -m "" --cov=farm --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=90
      - name: Report failure
        if: failure()
        uses: ./.github/actions/report-scheduled-failure
        with:
          token: ${{ github.token }}

  benchmark-smoke:
    # Exercises the benchmark runner end to end on a tiny spec and keeps the
    # results JSON as an artifact so timings can be trended over time.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps
      - name: List registered benchmark experiments
        run: python -m benchmarks.run_benchmarks --list
      - name: Run benchmark smoke spec
        run: python -m benchmarks.run_benchmarks --spec benchmarks/specs/ci_smoke.yaml
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-smoke-results
          path: benchmarks/results/ci_smoke/
          if-no-files-found: error
      - name: Report failure
        if: failure()
        uses: ./.github/actions/report-scheduled-failure
        with:
          token: ${{ github.token }}
